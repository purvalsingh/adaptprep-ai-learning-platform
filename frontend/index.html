<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="AdaptPrep — AI-powered JEE & NEET preparation for students, teachers and institutes." />
        <meta name="theme-color" content="#4a3aa7" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
        <title>AdaptPrep — AI exam prep that adapts to you</title>
        <script>
            // Apply the saved theme before first paint to avoid a flash.
            try {
                var t = localStorage.getItem('adaptprep-theme');
                if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        </script>
    </head>
    <body>
        <noscript>AdaptPrep needs JavaScript enabled.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
